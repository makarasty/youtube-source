name: Build integration
on:
  push:
    branches: [ integration ]
  workflow_dispatch:
  workflow_call: # from sync-upstream.yml after it merged upstream

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # always the branch tip: when called from the sync, github.sha is the old commit
          ref: integration
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 17
          cache: gradle

      - uses: gradle/actions/setup-gradle@v4

      - name: Build plugin jar
        run: ./gradlew :plugin:build --no-daemon

      - name: Name the release
        run: |
          echo "SHORT_SHA=$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"
          echo "FULL_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Publish release
        uses: softprops/action-gh-release@v2.6.2
        with:
          tag_name: int-${{ env.SHORT_SHA }}
          target_commitish: ${{ env.FULL_SHA }}
          name: Integration build ${{ env.SHORT_SHA }}
          files: plugin/build/libs/youtube-plugin-*.jar
